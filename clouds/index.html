rce=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Tornadic_Waterspout_near_Chaihu%C3%ADn,_Chile_September_2025.jpg","credit":"MattWithX1 · CC BY-SA 4.0"}];
const V = '1791073212642';
let sel = 0, open = false, ctrl = false, cropMode = false;
const grid = document.getElementById('grid'), fs = document.getElementById('fs'),
      big = document.getElementById('big');
const pre = {};
CELLS.forEach((c, i) => {
  if (c.orig) { pre[c.orig] = new Image(); pre[c.orig].src = c.orig; }
  const d = document.createElement('div'); d.className = 'cell'; d.title = c.label;
  const im = document.createElement('img'); im.src = c.file + '?v=' + V; im.loading = 'lazy'; im.alt = c.name;
  d.appendChild(im); grid.appendChild(d);
  d.addEventListener('click', (e) => {
    if (e.ctrlKey || e.metaKey) { if (c.page) window.open(c.page, '_blank'); return; }
    sel = i; paint(); openFs(false);
  });
});
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function paint() {
  grid.children[sel].scrollIntoView({ block: 'nearest' });
}
function render() {
  const c = CELLS[sel];
  const src = (ctrl && c.orig) ? c.orig : c.file;
  big.src = src;
  mini.src = src + (src.includes('?') ? '&' : '?') + 'v=' + V;
  cap.innerHTML = (ctrl && c.orig)
    ? '<span class="orig">original photo</span> — ' + esc(c.credit || c.label) + (c.page ? ' · ctrl+click opens the source page' : '')
    : c.label;
}
function select(i) { sel = (i + CELLS.length) % CELLS.length; paint(); if (open) render(); }
function openFs(native) { open = true; fs.classList.add('open'); render();
  if (native && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); }
function closeFs() { open = false; fs.classList.remove('open'); mini.classList.remove('open'); ctrl = false;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); }
addEventListener('keydown', (e) => {
  if (e.key === 'Control' || e.key === 'Meta') { ctrl = true; if (open) render(); return; }
  if (e.key === 'Escape') { closeFs(); return; }
  if (e.key === 'f' || e.key === 'F') { open ? closeFs() : openFs(true); return; }
  if (e.key === 'Enter' && !open) { openFs(false); return; }
  const move = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 10, ArrowUp: -10 }[e.key];
  if (move !== undefined) { e.preventDefault(); select(sel + move); }
});
addEventListener('keyup', (e) => {
  if (e.key === 'Control' || e.key === 'Meta') { ctrl = e.ctrlKey || e.metaKey; if (open) render(); }
});
addEventListener('blur', () => { ctrl = false; if (open) render(); });
fs.addEventListener('click', (e) => {
  if (cropMode) return // the studio client handles the crop click
  if (e.ctrlKey || e.metaKey) { const c = CELLS[sel]; if (c.page) window.open(c.page, '_blank'); return; }
  closeFs();
});
select(0);
