<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>an angel dances in the sparks of a bonfire</title>
<link id="favicon" rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkAAIAAAoAAv/lxKUAAAAASUVORK5CYII=">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #07102a; overflow: hidden; }
  canvas { display: block; }
  #creditLink {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);

    font-size: 14px;
    display: none;
    z-index: 1000;
    cursor: pointer;
    white-space: nowrap;
    transition: color 120ms ease;
    padding: 8px 12px;

  }
  #creditLink:hover {
    color: rgba(255,220,140,1);
    text-decoration: underline;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="creditLink" href="https://brlka.itch.io/an-angel-dances-in-the-sparks-of-a-bonfire" target="_blank">original game by brlka</a>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d', { alpha: false }); // skip per-pixel alpha compositing
const creditLink = document.getElementById('creditLink');

// ── Logical canvas: scaled to fill screen with letterbox ─────
const LW = 1920, LH = 1080;
const HORIZON = 240;  // bot lookahead frames (~4s)

let scale = 1, _appOx = 0, _appOy = 0;
function resize() {
  scale = Math.min(window.innerWidth / LW, window.innerHeight / LH);
  _appOx = (window.innerWidth  - LW * scale) / 2;
  _appOy = (window.innerHeight - LH * scale) / 2;
  c.width  = window.innerWidth;
  c.height = window.innerHeight;
  c.style.position = 'absolute';
  c.style.left = '0'; c.style.top = '0';
}
resize();
window.addEventListener('resize', () => { resize(); buildStars(); });
let _needResize = false;
new ResizeObserver(() => { _needResize = true; }).observe(document.documentElement);

function applyLogical()   { ctx.setTransform(scale, 0, 0, scale, _appOx, _appOy); }
function resetTransform() { ctx.setTransform(1, 0, 0, 1, 0, 0); }

// ── Audio ───────────────────────────────────────────────
let audioCtx = null;
let audioUnlocked = false;  // muted until first real user input (keypress / click)
function getAudio() {
  if (!audioUnlocked) return null;
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playBreath(isInhale) {
  try {
    const ac = getAudio();
    if (!ac) return;
    const t0 = ac.currentTime;
    const dur = isInhale ? 1.8 : 2.2;
    const sr  = ac.sampleRate;

    // pink noise (softer, more organic than white)
    const buf = ac.createBuffer(1, sr * dur, sr);
    const d   = buf.getChannelData(0);
    let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0;
    for (let i = 0; i < d.length; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99886*b0 + w*0.0555179;
      b1 = 0.99332*b1 + w*0.0750759;
      b2 = 0.96900*b2 + w*0.1538520;
      b3 = 0.86650*b3 + w*0.3104856;
      b4 = 0.55000*b4 + w*0.5329522;
      b5 = -0.7616*b5 + w*0.0168981;
      d[i] = (b0+b1+b2+b3+b4+b5) * 0.11;
    }

    const src = ac.createBufferSource(); src.buffer = buf;

    // shaping filter
    const filt = ac.createBiquadFilter();
    if (isInhale) {
      // inhale: nasal, rising hiss
      filt.type = 'bandpass'; filt.Q.value = 4;
      filt.frequency.setValueAtTime(1600, t0);
      filt.frequency.linearRampToValueAtTime(3200, t0 + dur * 0.8);
    } else {
      // exhale: chesty, falling warmth
      filt.type = 'bandpass'; filt.Q.value = 3;
      filt.frequency.setValueAtTime(1200, t0);
      filt.frequency.exponentialRampToValueAtTime(400, t0 + dur);
    }

    // master envelope — very gradual onset, no click/drum at all
    const gain = ac.createGain();
    if (isInhale) {
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.0, t0 + 0.05); // silent start
      gain.gain.linearRampToValueAtTime(0.13, t0 + dur * 0.65);
      gain.gain.linearRampToValueAtTime(0, t0 + dur);
    } else {
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.13, t0 + 0.18); // 180ms ramp-in
      gain.gain.linearRampToValueAtTime(0.10, t0 + dur * 0.5);
      gain.gain.linearRampToValueAtTime(0, t0 + dur);
    }

    src.connect(filt); filt.connect(gain); gain.connect(ac.destination);
    src.start(t0);
  } catch(e) {}
}
function playDeath() {
  try {
    const ac = getAudio();
    if (!ac) return;
    const osc=ac.createOscillator(), g=ac.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(180,ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40,ac.currentTime+0.6);
    g.gain.setValueAtTime(0.25,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.7);
    osc.connect(g);g.connect(ac.destination);
    osc.start();osc.stop(ac.currentTime+0.7);
    const buf=ac.createBuffer(1,ac.sampleRate*0.4,ac.sampleRate);
    const dd=buf.getChannelData(0);
    for(let i=0;i<dd.length;i++) dd[i]=(Math.random()*2-1)*Math.pow(1-i/dd.length,0.5)*0.4;
    const ns=ac.createBufferSource(); ns.buffer=buf;
    const ng=ac.createGain(); ng.gain.value=0.15;
    ns.connect(ng);ng.connect(ac.destination);ns.start();
  } catch(e){}
}
function playStart() {
  try {
    const ac = getAudio();
    if (!ac) return;
    [330,440,550].forEach((freq,i)=>{
      const osc=ac.createOscillator(), g=ac.createGain();
      osc.type='sine'; osc.frequency.value=freq;
      g.gain.setValueAtTime(0,ac.currentTime+i*0.07);
      g.gain.linearRampToValueAtTime(0.045,ac.currentTime+i*0.07+0.03);
      g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+i*0.07+0.22);
      osc.connect(g);g.connect(ac.destination);
      osc.start(ac.currentTime+i*0.07);
      osc.stop(ac.currentTime+i*0.07+0.25);
    });
  } catch(e){}
}
function playHarvest() {
  try {
    const ac = getAudio();
    if (!ac) return;
    const t0 = ac.currentTime;
    [1480, 1980].forEach((freq, i) => {
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t0 + i * 0.018);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.82, t0 + i * 0.018 + 0.18);
      g.gain.setValueAtTime(0, t0 + i * 0.018);
      g.gain.linearRampToValueAtTime(0.038, t0 + i * 0.018 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + i * 0.018 + 0.22);
      osc.connect(g); g.connect(ac.destination);
      osc.start(t0 + i * 0.018);
      osc.stop(t0 + i * 0.018 + 0.25);
    });
  } catch(e) {}
}

// ── Stars ───────────────────────────────────────────────
let stars = [], starCanvas = null;
function buildStars() {
  stars = [];
  const n = Math.floor(LW * LH / 11000);
  for (let i=0;i<n;i++) stars.push({
    x: Math.random()*LW, y: Math.random()*LH,
    r: Math.random()<0.07?1.4:Math.random()<0.25?0.9:0.45,
    a: 0.12+Math.random()*0.5
  });
  // Pre-render stars at the actual screen size so per-frame blit is a 1:1 copy
  // (no canvas scaling). Background colour is baked in — main loop skips fillRect.
  starCanvas = document.createElement('canvas');
  starCanvas.width  = window.innerWidth;
  starCanvas.height = window.innerHeight;
  const sCtx = starCanvas.getContext('2d');
  sCtx.fillStyle = '#07102a';
  sCtx.fillRect(0, 0, starCanvas.width, starCanvas.height);
  // Letterbox so star field aligns with the game's logical space.
  const _s  = Math.min(window.innerWidth / LW, window.innerHeight / LH);
  const _ox = (window.innerWidth  - LW * _s) / 2;
  const _oy = (window.innerHeight - LH * _s) / 2;
  sCtx.setTransform(_s, 0, 0, _s, _ox, _oy);
  stars.forEach(s=>{
    sCtx.beginPath(); sCtx.arc(s.x,s.y,s.r,0,Math.PI*2);
    sCtx.fillStyle=`rgba(200,215,255,${s.a})`; sCtx.fill();
  });
}
buildStars();
function drawStars() {
  // identity transform: 1:1 blit, no scaling cost
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(starCanvas, 0, 0);
}

// ── Palette ─────────────────────────────────────────────
const COLORS=['#ff0000','#e50000','#cc0000','#ff3300','#ff4400','#ff5500',
              '#ff6600','#ff7700','#ff8800','#ff9900','#ffaa00','#ffbb00',
              '#ffcc00','#ffdd00','#ffee00'];
function fireColor(){return COLORS[Math.floor(Math.random()*COLORS.length)];}
// Blend a hex color 30% toward the background — used to fade harvested sparks.
const _BG_R = 7, _BG_G = 16, _BG_B = 42;
function darkenForHarvest(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 0xff, g = (n >> 8) & 0xff, b = n & 0xff;
  const nr = Math.round(r * 0.7 + _BG_R * 0.3);
  const ng = Math.round(g * 0.7 + _BG_G * 0.3);
  const nb = Math.round(b * 0.7 + _BG_B * 0.3);
  return '#' + ((nr << 16) | (ng << 8) | nb).toString(16).padStart(6, '0');
}

// ── Constants (logical pixels, screen-independent) ──────
const ANGEL_R   = 20;  // visual / near-miss ring radius
const HIT_R     = 6;   // actual collision hitbox (center only)
const SIM_R     = 16;  // AI simulation hitbox — generous margin over HIT_R=6 to absorb sub-frame motion of fast sparks (up to ~23 px/frame)
const SPAWN_ZONE = 250;  // left band where new sparks can appear with little reaction time — bot treats this as soft-deadly
const MAX_SPEED = 42;
const ACC       = MAX_SPEED / 50;
const FRICTION  = 0.92;  // drift multiplier per frame when no direction held — lower = longer glide
const DRIFT_MIN = 0.05;  // vel magnitude below which drift snaps to 0
const LOW_SPEED_BOOST_THRESHOLD = 0;  // boost (1.5×) when |vel| is below this — same mult as reversing; adjust to taste
const DIRS      = Object.freeze([-1, 0, 1]);
// Angel Y-path: ay = LH/2 + sin(t * AY_W) * AY_AMP.
// SW/CW enable a sin recurrence in the bot lookahead (one Math.sin per frame instead of HORIZON).
const AY_W = 0.0567, AY_AMP = LH * 0.35, AY_MID = LH * 0.5;
const AY_SW = Math.sin(AY_W), AY_CW = Math.cos(AY_W);
const LEFT_KEYS  = new Set(['ArrowLeft',  'a', 'A']);
const RIGHT_KEYS = new Set(['ArrowRight', 'd', 'D']);
// pre-computed font strings — LH is a fixed constant, no Math.round per frame
const FONT_HIT    = `${Math.round(LH*0.22)}px monospace`;
const FONT_BASE   = `${Math.round(LH*0.022)}px monospace`;
const FONT_INFO_H = `${Math.round(LH*0.038)}px monospace`;
const FONT_INFO_S = `${Math.round(LH*0.024)}px monospace`;
const FONT_INFO_XS= `${Math.round(LH*0.019)}px monospace`;
const FONT_INFO_TN= `${Math.round(LH*0.018)}px monospace`;

// ── Game state ───────────────────────────────────────────
let state = 'idle';      // idle | playing | dead | screensaver
let screensaver = false;
let t = 0, startTime = 0, elapsed = 0;
let sparks = [], spawnAccum = 0, spawnPause = 0;
let particles = [];
let keys = {};
let angelX = LW/2, angelSpeed = 0;
let angelTrail = [];  // [{x,y,ts}] live white trail
let deathTrail  = [];  // snapshot of trail on death, drawn pink and faded 2x faster
let deathTrailBorn = 0; // performance.now() when death trail was created
let breathScale = 1.0, lastAy = LH*0.5, lastDy = 0, breathCooldown = 0;
let aiVelocity = 0;
let aiInputDir = 0;         // -1/0/1 direction currently committed by the bot
let aiInputHeldFor = 0;     // consecutive ticks aiInputDir has been held
let showUI = false;        // HUD visible (X to toggle) — hidden until first interaction
let harvestMode = false;   // Z toggles "harvest" mode: graze sparks to score points
let harvestScore = 0;      // count of sparks harvested this run
let mouseLx = -1, mouseLy = -1;  // mouse position in logical coords (for hover effects)
const _btnFlash = {};      // key → ts of last click flash
let lastDir     = 0;       // -1 left / 1 right — newest key wins
let prevPlayerDir = 0;     // direction last tick — detects first frame of input
let playerDirFrames = 0;   // frames held in current direction — resets on change
let playerKeyPressCooldown = 0;  // frames until next 6x first-frame boost is allowed
let aiInputCooldown = 0;   // frames until next 6x first-frame boost is allowed (bot)
let deathTimer = null;
let attractTimer = null;
let hitFlashes = [];
let bestTime = 0;
let bestHarvestScore = 0;
let showStats = false;
let firstInteraction = false;  // tracks whether user has interacted yet (for UI reveal)
const RUNS_KEY = 'angel.runs.v1';
const RUNS_KEY_HARVEST = 'angel.runs.harvest.v1';
let runs = [];         // [{ms, ts, bot}] — normal mode, chronological
let runsHarvest = [];  // [{score, ts, bot}] — harvest mode, chronological
let trailHue = 0;          // current hue offset for live trail (deg)
let trailHueSpeed = 0;     // auto-cycle rate (deg per tick); adjusted by I/O
let trailTinted = false;   // becomes true on first tint input; otherwise trail is pure white
function loadRuns() {
  try { runs = JSON.parse(localStorage.getItem(RUNS_KEY)) || []; } catch { runs = []; }
  try { runsHarvest = JSON.parse(localStorage.getItem(RUNS_KEY_HARVEST)) || []; } catch { runsHarvest = []; }
  bestTime = runs.filter(r => !r.bot).reduce((m, r) => Math.max(m, r.ms), 0);
  bestHarvestScore = runsHarvest.filter(r => !r.bot).reduce((m, r) => Math.max(m, r.score), 0);
}
function saveRuns() {
  try { localStorage.setItem(RUNS_KEY, JSON.stringify(runs.slice(-500))); } catch {}
  try { localStorage.setItem(RUNS_KEY_HARVEST, JSON.stringify(runsHarvest.slice(-500))); } catch {}
}
function recordRun(ms, bot) {
  if (harvestMode) {
    runsHarvest.push({ score: harvestScore, ts: Date.now(), bot: !!bot });
    if (runsHarvest.length > 500) runsHarvest = runsHarvest.slice(-500);
  } else {
    runs.push({ ms, ts: Date.now(), bot: !!bot });
    if (runs.length > 500) runs = runs.slice(-500);
  }
  saveRuns();
}
loadRuns();
let trailT = 0;  // monotonic, never resets — trail timestamps stay valid
let keyHintTs = -Infinity; // timestamp of last non-movement keypress
let lastMoveInputTs = -Infinity; // timestamp of last move key event (not reset on death)
let hadInputSinceDeath = false;  // true once player presses a key after dying
let showInfo = false;      // info overlay active

let zoneBonuses = [0,0,0,0,0]; // per-zone exploration bonus; grows over time, cleared on visit
let targetZoneIdx = 2, zoneArrivalFrames = 0; // stable zone targeting — updated with hysteresis
let _futureAys = new Float32Array(HORIZON + 2);  // precomputed futureAy[0..HORIZON]; refilled each frame
const _hScratch = new Float32Array(50);  // scratch: per-spark min-distance for harvest scoring
let _futureAyT = -1;                      // t-value when _futureAys was last filled
let _liveSparks = [];                     // non-fading sparks snapshot for simulation
let _gapTargets = [];                     // narrow Y gaps between spark pairs, precomputed each tick
let _gapPool = [];                        // reusable pool to avoid per-frame object allocation
let _deadlyAt = (() => { const a = new Array(HORIZON + 2); for (let i = 0; i <= HORIZON + 1; i++) a[i] = new Float32Array(100); return a; })();
let _deadlyCnt = new Int32Array(HORIZON + 2);

let _ayCache = AY_MID, _ayFrame = -1;
function angelY() {
  if (_ayFrame !== t) { _ayCache = AY_MID + Math.sin(t * AY_W) * AY_AMP; _ayFrame = t; }
  return _ayCache;
}

// ── Sparks ───────────────────────────────────────────────
function spawnSpark(ramp) {
  const lo = 1.7;
  const hi = 7.6 + ramp * 4;
  // In screensaver mode use the seeded PRNG so spawns match the sim exactly.
  // fireColor() stays on Math.random — cosmetic only, not consumed by sim.
  const rand = Math.random.bind(Math);
  const w  = 44 + rand() * 64;
  const vx = lo + rand() * (hi - lo);
  // Spawn one tick behind the border so after the immediate x += vx advance
  // the right edge lands exactly at 0 (left border), never visible on spawn.
  return {
    x: -(w + vx),
    y: rand()*LH*0.8+LH*0.1,
    w, h: 32+rand()*40,
    vx,
    vy: (rand()-0.5) * 0.25,
    ay: (rand()-0.5) * 0.004,
    color: fireColor()
  };
}

// ── AI planner state ─────────────────────────────────────
let aiCommitFrames = 0;

// Reward projecting through a narrow vertical gap between two approaching sparks.
// Tighter gaps score higher; angel Y must align with the gap at ~20 frames out.
function gapThreadBonus(projX) {
  if (_gapTargets.length === 0) return 0;
  const ay = _futureAys[20];
  let best = 0;
  for (const g of _gapTargets) {
    if (ay < g.gapTop - 30 || ay > g.gapBot + 30) continue;
    const xCenter = (g.xLo + g.xHi) / 2;
    const halfW = (g.xHi - g.xLo) / 2 + 80;
    const dist = Math.max(0, Math.abs(projX - xCenter) - halfW);
    if (dist > 160) continue;
    best = Math.max(best, g.tightness * (1 - dist / 160) * 35);
  }
  return best;
}

// ── Per-frame input-mode physics step ─────────────────────
// Reversing (vel opposite to dir) or below LOW_SPEED_BOOST_THRESHOLD: 1.5× accel.
// Otherwise: 1.0–1.8× accel scaled inversely by current speed.
function simInputStep(dir, vel) {
  if (dir === 0) {
    const nv = vel * FRICTION;
    return Math.abs(nv) < DRIFT_MIN ? 0 : nv;
  }
  let mult;
  if (dir * vel < 0 || Math.abs(vel) < LOW_SPEED_BOOST_THRESHOLD)  mult = 1.95;
  else                                                               mult = 1 + (1 - Math.abs(vel) / MAX_SPEED) * 0.8;
  const nv = vel + ACC * 1.5 * mult * dir;
  return dir < 0 ? Math.max(-MAX_SPEED, nv) : Math.min(MAX_SPEED, nv);
}

// ── Shared movement applier (bot + player) ────────────────
// Writes into a reused scratch object to avoid per-tick allocation.
const _moveOut = { vel: 0, heldFrames: 0, cooldown: 0 };
function stepAngelMovement(dir, prevDir, heldFrames, cooldown, vel) {
  let newHeld;
  if (dir !== prevDir)  newHeld = 1;
  else if (dir !== 0)   newHeld = heldFrames + 1;
  else                  newHeld = 0;
  let newVel, newCooldown = cooldown;
  if (dir !== 0) {
    newVel = simInputStep(dir, vel);
  } else {
    newVel = vel * FRICTION;
    if (Math.abs(newVel) < DRIFT_MIN) newVel = 0;
  }
  _moveOut.vel = newVel;
  _moveOut.heldFrames = newHeld;
  _moveOut.cooldown = newCooldown;
  return _moveOut;
}

// ── AI: input-mode 2-level lookahead ──────────────────────────────────────
// Simulate dir for BRANCH_AT frames, then branch to all 3 continuations.
// The bot can now see escape routes that require a direction change mid-flight.
function scoreInputDeep(dir) {
  if (_liveSparks.length === 0) return HORIZON;
  const BRANCH_AT = 12;
  // Mirror the real cooldown gate so the planner never over-promises boost.
  const isNewDir = (dir !== aiInputDir) && aiInputCooldown <= 0;
  let simX = angelX, simVel = aiVelocity;
  let wallTime = 0;  // consecutive frames against either wall
  for (let dt = 1; dt <= BRANCH_AT; dt++) {
    simVel = simInputStep(dir, simVel, dt, isNewDir && dt === 1);
    simX += simVel;
    if (simX <= 41 || simX >= LW - 41) {
      simX = Math.max(40, Math.min(LW - 40, simX));
      // Left wall = spawn zone; never let phase 1 commit to hugging it.
      if (++wallTime > 6 && simX <= 41) return dt;
    } else {
      wallTime = 0;
    }
    const fay = _futureAys[dt];
    const fayHi = fay + SIM_R, fayLo = fay - SIM_R;
    const simHi = simX + SIM_R, simLo = simX - SIM_R;
    for (const s of _liveSparks) {
      const fx = s.x + s.vx * dt;
      if (simHi <= fx || simLo >= fx + s.w) continue;
      const fy = s._futY[dt];
      if (fayHi > fy && fayLo < fy + s.h) return dt - 1;
    }
  }
  // Branch: try all 3 continuations from intermediate state, take the best.
  // Wall time is inherited so traps that span both phases are correctly penalised.
  let bestCont = 0;
  for (const contDir of DIRS) {
    let cX = simX, cV = simVel, cWallTime = wallTime, cont = 0;
    const isContNewDir = (contDir !== dir);
    for (let i = 1; i <= HORIZON - BRANCH_AT; i++) {
      const dt = BRANCH_AT + i;
      cV = simInputStep(contDir, cV, i, isContNewDir && i === 1);
      cX += cV;
      cX = Math.max(40, Math.min(LW - 40, cX));
      if (cX <= 41 || cX >= LW - 41) {
        // Right wall is dangerous: cuts off leftward escape. Penalise sooner than before.
        if (++cWallTime > (cX <= 41 ? 20 : 25)) {
          cont = (cX <= 41 ? 60 : 100) - BRANCH_AT;
          break;
        }
      } else {
        cWallTime = 0;
      }
      const fay = _futureAys[dt];
      const fayHi = fay + SIM_R, fayLo = fay - SIM_R;
      const cHi = cX + SIM_R, cLo = cX - SIM_R;
      let hit = false;
      for (const s of _liveSparks) {
        const fx = s.x + s.vx * dt;
        if (cHi <= fx || cLo >= fx + s.w) continue;
        const fy = s._futY[dt];
        if (fayHi > fy && fayLo < fy + s.h) { hit = true; break; }
      }
      if (hit) break;
      cont = i;
    }
    bestCont = Math.max(bestCont, cont);
    if (bestCont >= HORIZON - BRANCH_AT) break;
  }
  return BRANCH_AT + bestCont;
}

function aiChooseDirection(currentDirSurvive) {
  const maxZi  = targetZoneIdx;
  const zTargX = 40 + (maxZi + 0.5) * (LW - 80) / 5;
  const zDir   = zTargX - angelX;
  let bestDir = 0, bestScore = -Infinity;
  for (const dir of DIRS) {
    // Reuse the survive score already computed for the current direction

    // Older points (index 0) → alpha≈0 (fully BG); newest (index len-1) → alpha=1.
    // Consecutive segments with the same blended color are batched into one path.
    ctx.lineWidth = 4; ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
    function _drawTrail(arr, overrideRGB, globalFade) {
      if (arr.length <= 2 || globalFade <= 0) return;
      const raw = arr, len = raw.length;
      // Pre-cache parsed RGB for each point (only if not overriding)
      let prevBlended = null, prevCSS = null;
      ctx.beginPath();
      let inPath = false;
      for (let i = 0; i < len - 1; i++) {
        const alpha = (i / (len - 1)) * globalFade;
        const rgb = overrideRGB || _parseRGB(raw[i].color || '#ffffff');
        const blended = _blendColor(rgb, alpha);
        if (blended !== prevBlended) {
          if (inPath) ctx.stroke();
          ctx.strokeStyle = blended;
          ctx.beginPath();
          ctx.moveTo(raw[i].x, raw[i].y);
          inPath = true;
          prevBlended = blended;
        }
        ctx.lineTo(raw[i + 1].x, raw[i + 1].y);
      }
      if (inPath) ctx.stroke();
    }
    const dtFade = deathTrailBorn > 0 ? Math.max(0, 1 - (now2 - deathTrailBorn) / 1500) : 0;
    _drawTrail(deathTrail, [255, 136, 187], dtFade);  // pink death trail
    _drawTrail(angelTrail, null, 1.0);                 // live trail: per-segment stored color
  }

  // draw sparks + drop fully-faded ones in a single pass; clip to game area
  // so sparks entering/exiting never bleed into the letterbox region
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, LW, LH);
  ctx.clip();
  {
    let w = 0;
    for (let i = 0; i < sparks.length; i++) {
      const s = sparks[i];
      if (s.fading) {
        const age = now2 - s.fadeStart;
        if (age >= 800) continue;  // drop
        ctx.globalAlpha = 1 - age / 800;
        ctx.fillStyle = s.color;
        ctx.fillRect(s.x, s.y, s.w, s.h);
        ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = s.color;
        ctx.fillRect(s.x, s.y, s.w, s.h);
        if (s.harvested) {
          const r = 2 + (now2 - s.harvestTs) / 1000 * 2;
          if (r >= 0.5) {
            ctx.fillStyle = '#07102a';
            ctx.beginPath();
            ctx.arc(s.x + s.w * 0.5, s.y + s.h * 0.5, r, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
      sparks[w++] = s;
    }
    sparks.length = w;
  }
  ctx.restore();

  drawParticles();

  if (state==='playing') {
    const ax=angelX, ay=angelY();
    if (doTick) {
    // live trail: always push, window 1800
    if (trailT % 2 === 0) angelTrail.push({x:ax, y:ay, ts:trailT, color: trailTinted ? `hsl(${trailHue|0},52%,86%)` : null});
    while (angelTrail.length > 0 && trailT - angelTrail[0].ts > 1800) angelTrail.shift();
    // death trail: snapshot — never trimmed, fades visually and is cleared on reset

    // collision — reuse ax/ay already computed above (avoids N×angelY() calls)
    for (let i = 0; i < sparks.length; i++) {
      const s = sparks[i];
      if (!s.fading && ax+HIT_R > s.x && ax-HIT_R < s.x+s.w &&
          ay+HIT_R > s.y && ay-HIT_R < s.y+s.h) { onHit(); break; }
    }

    // harvest: close to non-harvested spark → score++, fade spark, white poof
    if (harvestMode) {
      for (let i = 0; i < sparks.length; i++) {
        const s = sparks[i];
        if (s.fading || s.harvested) continue;
        const dx = ax < s.x ? s.x - ax : ax > s.x + s.w ? ax - (s.x + s.w) : 0;
        const dy = ay < s.y ? s.y - ay : ay > s.y + s.h ? ay - (s.y + s.h) : 0;
        if (dx*dx + dy*dy < 14500) {
          s.harvested = true;
          s.harvestTs = now2;
          s.color = darkenForHarvest(s.color);
          harvestScore++;
          playHarvest();
          for (let k = 0; k < 20; k++) {
            const ang = Math.random() * Math.PI * 2;
            const sp = 1.2 + Math.random() * 5.5;
            particles.push({
              x: ax + (Math.random() - 0.5) * 10, y: ay + (Math.random() - 0.5) * 10,
              vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.6,
              life: 1, decay: 0.016 + Math.random() * 0.014,
              size: 1.2 + Math.random() * 3.0,
              color: Math.random() < 0.6 ? '#ffffff' : (Math.random() < 0.5 ? '#e8d8ff' : '#c8f0ff')
            });
          }
        }
      }
    }


    } // end doTick
    drawAngel(ax,ay);


    // hit flash: large time at center, fades over 1.5s. Compact always so the
    // array doesn't grow while the UI is hidden; only render when showUI.
    {
      let w = 0;
      for (let i = 0; i < hitFlashes.length; i++) {
        const f = hitFlashes[i];
        const age = (now2 - f.ts) / 1500;
        if (age >= 1) continue;
        if (showUI) {
          ctx.globalAlpha = Math.pow(1 - age, 1.5) * 0.6;
          ctx.textAlign = 'center';
          ctx.fillStyle = '#ffffff';
          ctx.font = FONT_HIT;
          ctx.fillText(f.harvest ? String(f.score) : (f.elapsed / 1000).toFixed(1), LW / 2, LH * 0.55);
          ctx.globalAlpha = 1;
        }
        hitFlashes[w++] = f;
      }
      hitFlashes.length = w;
    }
    if (showUI) {

    // top-right: harvest score in harvest mode, best time otherwise (player only)
    if (harvestMode) {
      if (!screensaver && bestHarvestScore > 0) {
        const hoverBest = _hit(mouseLx, mouseLy, LW - 240, 20, 220, 42);
        const flashAge = (now2 - (_btnFlash.best || 0)) / 250;
        ctx.textAlign = 'right';
        ctx.fillStyle = hoverBest ? 'rgba(255,255,255,0.45)' : 'rgba(255,220,140,0.22)';
        if (flashAge < 1) ctx.fillStyle = `rgba(255,255,255,${0.4 + (1 - flashAge) * 0.4})`;
        ctx.font = FONT_BASE;
        ctx.fillText(`best  ${bestHarvestScore}`, LW - 40, 44);
      }
    } else if (!screensaver && bestTime > 0) {
      const hoverBest = _hit(mouseLx, mouseLy, LW - 240, 20, 220, 42);
      const flashAge = (now2 - (_btnFlash.best || 0)) / 250;
      ctx.textAlign = 'right';
      ctx.fillStyle = hoverBest ? 'rgba(255,255,255,0.45)' : 'rgba(255,255,255,0.22)';
      if (flashAge < 1) ctx.fillStyle = `rgba(255,255,255,${0.4 + (1 - flashAge) * 0.4})`;
      ctx.font = FONT_BASE;
      ctx.fillText(`best  ${(bestTime/1000).toFixed(1)}`, LW - 40, 44);
    }

    // key hint: fades over 2.2 s after a non-movement key
    const hintAge = (now2 - keyHintTs) / 2200;
    if (hintAge < 1) {
      ctx.globalAlpha = Math.pow(1 - hintAge, 1.8) * 0.72;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.font = FONT_BASE;
      ctx.fillText('\u2190 \u2192  or  A / D  to move', LW/2, LH*0.82);
      ctx.globalAlpha = 1;
    }

    // (a) info button — top-left with hover + click-flash
    {
      const hoverInfo = _hit(mouseLx, mouseLy, 20, 20, 200, 42);
      const flashAge = (now2 - (_btnFlash.info || 0)) / 250;
      const baseA = screensaver ? 0.10 : 0.22;
      let a = hoverInfo ? 0.55 : baseA;
      if (flashAge < 1) a = 0.6 + (1 - flashAge) * 0.4;
      ctx.textAlign = 'left';
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.font = FONT_BASE;
      ctx.fillText('(aaditsoab)', 40, 44);
    }

    }
    // end showUI
  }

  // stats overlay (player run history)
  if (showStats) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = 'rgba(7,16,42,0.96)';
    ctx.fillRect(0, 0, c.width, c.height);
    applyLogical();

    const isHarvestStats = harvestMode;
    const playerRuns = isHarvestStats
      ? runsHarvest.filter(r => !r.bot)
      : runs.filter(r => !r.bot);
    const last10 = playerRuns.slice(-10).reverse(); // newest first

    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.font = FONT_INFO_H;
    ctx.fillText(isHarvestStats ? 'harvest history' : 'history', LW/2, LH*0.10);

    // last 10 run values in one row
    const rowY = LH*0.22;
    const cellW = LW * 0.86 / 10;
    const rowX0 = LW * 0.07;
    ctx.font = FONT_INFO_S;
    for (let i = 0; i < last10.length; i++) {
      const r = last10[i];
      const cx = rowX0 + i * cellW + cellW / 2;
      ctx.fillStyle = 'rgba(255,255,255,0.62)';
      ctx.textAlign = 'center';
      ctx.fillText(isHarvestStats ? String(r.score) : (r.ms/1000).toFixed(1), cx, rowY);
    }

    // line chart of all player runs
    const chartX0 = LW*0.07, chartX1 = LW*0.86;
    const chartY0 = LH*0.35, chartY1 = LH*0.82;
    const chartW = chartX1 - chartX0, chartH = chartY1 - chartY0;
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(chartX0, chartY0, chartW, chartH);
    if (playerRuns.length >= 2) {
      const maxVal = playerRuns.reduce((m, r) => Math.max(m, isHarvestStats ? r.score : r.ms), 1);
      const n = playerRuns.length;
      const grad = ctx.createLinearGradient(0, chartY0, 0, chartY1);
      grad.addColorStop(0,    '#ffdd00');
      grad.addColorStop(0.5,  '#ff8800');
      grad.addColorStop(1,    '#ff2200');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 3;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const val = isHarvestStats ? playerRuns[i].score : playerRuns[i].ms;
        const x = chartX0 + (i / (n - 1)) * chartW;
        const y = chartY1 - (val / maxVal) * chartH;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      // 4 y-axis labels on the right
      ctx.fillStyle = 'rgba(255,255,255,0.38)';
      ctx.font = FONT_INFO_TN;
      ctx.textAlign = 'left';
      for (let j = 0; j <= 3; j++) {
        const frac = j / 3;
        const labelVal = maxVal * frac;
        const ly = chartY1 - frac * chartH;
        ctx.fillText(isHarvestStats ? Math.round(labelVal) : (labelVal/1000).toFixed(1), chartX1 + 8, ly + 4);
        // tick line
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(chartX0, ly); ctx.lineTo(chartX1, ly); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = FONT_INFO_TN;
      ctx.textAlign = 'right';
      ctx.fillText(`${n} runs`, chartX1, chartY0 - 8);
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.font = FONT_INFO_S;
      ctx.textAlign = 'center';
      ctx.fillText('need at least 2 runs for a chart', LW/2, chartY0 + chartH/2);
    }

    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.font = FONT_INFO_XS;
    ctx.textAlign = 'center';
    ctx.fillText('H or Esc to close', LW/2, LH*0.92);

    // clear-history button (bottom-right, two-stage confirm)
    {
      ctx.font = FONT_INFO_XS;
      ctx.textAlign = 'right';
      const label = _clearHistoryStage === 1 ? 'really delete?' : 'clear history';
      const tw = ctx.measureText(label).width;
      const bx = LW * 0.93, by = LH * 0.92;
      const hitX = bx - tw - 8, hitY = by - 18, hitW = tw + 16, hitH = 26;
      const hover = _hit(mouseLx, mouseLy, hitX, hitY, hitW, hitH);
      const armed = _clearHistoryStage === 1;
      const a = armed ? (hover ? 1 : 0.85) : (hover ? 0.7 : 0.3);
      ctx.fillStyle = armed ? `rgba(255,140,140,${a})` : `rgba(255,255,255,${a})`;
      ctx.fillText(label, bx, by);
      _clearHistoryRect.x = hitX; _clearHistoryRect.y = hitY;
      _clearHistoryRect.w = hitW; _clearHistoryRect.h = hitH;
    }

    ctx.restore();
  }

  // info overlay (inside logical transform, on top of everything)
  if (showInfo) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);  // screen coords for full coverage
    ctx.fillStyle = 'rgba(7,16,42,0.94)';
    ctx.fillRect(0, 0, c.width, c.height);
    applyLogical();  // logical coords for text
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.font = FONT_INFO_H;
    ctx.fillText('an angel dances', LW/2, LH*0.18);
    ctx.fillText('in the sparks', LW/2, LH*0.26);
    ctx.fillText('of a bonfire', LW/2, LH*0.34);
    ctx.fillStyle = 'rgba(255,255,255,0.52)';
    ctx.font = FONT_INFO_S;
    ctx.fillText('\u2190 \u2192  or  A / D  \u2014  move', LW/2, LH*0.50);
    ctx.fillText('bot takes over if you let go', LW/2, LH*0.56);
    ctx.font = FONT_INFO_XS;
    _infoToggleRects.length = 0;
    const _infoItems = [
      { key: 'X', label: 'toggle ui', on: showUI },
      { key: 'Z', label: 'harvest mode', on: harvestMode },
    ];
    for (let _ii = 0; _ii < _infoItems.length; _ii++) {
      const it = _infoItems[_ii];
      const ty = LH * (0.62 + _ii * 0.08);
      const text = `${it.key} \u2014 ${it.label}  \u00b7  ${it.on ? 'on' : 'off'}`;
      const tw = ctx.measureText(text).width;
      const hover = _hit(mouseLx, mouseLy, LW/2 - tw/2 - 8, ty - 20, tw + 16, 28);
      let a = it.on ? (hover ? 0.95 : 0.72) : (hover ? 0.5 : 0.28);
      ctx.fillStyle = it.on ? `rgba(255,220,140,${a})` : `rgba(255,255,255,${a})`;
      ctx.fillText(text, LW/2, ty);
      _infoToggleRects.push({ key: it.key, x: LW/2 - tw/2 - 8, y: ty - 20, w: tw + 16, h: 28 });
    }
    ctx.fillStyle = 'rgba(255,255,255,0.20)';
    ctx.fillText('click or Esc to close', LW/2, LH*0.78);
    ctx.restore();
  }

  resetTransform();
  const _wantCredit = showInfo ? 'block' : 'none';
  if (creditLink.style.display !== _wantCredit) creditLink.style.display = _wantCredit;

  // ── profiler ──
  const _dt = performance.now() - _frameStart;
  _profBuf[_profIdx] = _dt;
  _profIdx = (_profIdx + 1) % _profBuf.length;
  if (_profCount < _profBuf.length) _profCount++;
  if (_dt > _profWorst) _profWorst = _dt;
  if (showProf) {
    // sort only every 30 frames — reuse typed scratch array, zero alloc
    if ((_profSortFrame++ % 30) === 0) {
      _profScratch.set(_profBuf.subarray(0, _profCount));
      const sub = _profScratch.subarray(0, _profCount);
      sub.sort();
      _profMed = sub[Math.floor(_profCount / 2)] || 0;
      _profP95 = sub[Math.floor(_profCount * 0.95)] || 0;
      _profMax = sub[_profCount - 1] || 0;
    }
    const med = _profMed, p95 = _profP95, max = _profMax;
    ctx.font = '12px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(8, 8, 220, 70);
    ctx.fillStyle = '#9fe2ff';
    ctx.fillText(`med ${med.toFixed(2)} ms  p95 ${p95.toFixed(2)}`, 14, 24);
    ctx.fillText(`max ${max.toFixed(2)}  worst-ever ${_profWorst.toFixed(1)}`, 14, 40);
    ctx.fillText(`sparks ${sparks.length}  live ${_liveSparks.length}  gaps ${_gapTargets.length}`, 14, 56);
    ctx.fillText(`mode ${screensaver ? 'BOT' : 'PLAYER'}`, 14, 72);
  }
}

// autostart as AI immediately
start(true);
requestAnimationFrame(draw);

// ── Animated favicon: pre-baked data URIs, interval is a zero-cost string swap ──
(function () {
  const size = 16, border = 2;  // 16px is sufficient for a favicon
  const fc = document.createElement('canvas');
  fc.width = fc.height = size;
  const fctx = fc.getContext('2d');
  const link = document.getElementById('favicon');
  // render all colours once at startup — no encoding at runtime
  const frames = COLORS.map(col => {
    fctx.fillStyle = '#07102A';
    fctx.fillRect(0, 0, size, size);
    fctx.fillStyle = col;
    fctx.fillRect(border, border, size - border * 2, size - border * 2);
    return fc.toDataURL('image/png');
  });
  let phase = 0;
  link.href = frames[0];
  setInterval(() => {
    const roll = Math.random();
    if (roll < 1/3 && phase > 0) phase--;
    else if (roll < 2/3 && phase < frames.length - 1) phase++;
    link.href = frames[phase];
  }, 50);
})();
</script>
